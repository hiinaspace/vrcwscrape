[project]
name = "vrcw-search-data"
version = "0.1.0"
description = "ETL + embeddings for the static VRChat world search site"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.0.0", "pymysql>=1.1.1", "pyarrow>=15", "numpy", "pandas"]

[project.optional-dependencies]
# torch is installed separately (CPU wheel on cc-0, CUDA wheel on sayu) to keep envs small
embed = ["sentence-transformers", "scikit-learn"]

[tool.uv]
package = false
