<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VRChat World Search</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%236d5dfc'/%3E%3C/svg%3E">
</head>
<body>
<div id="app">
  <header class="top">
    <h1>VRChat World Search</h1>
    <div class="qwrap">
      <input id="q" data-testid="search-input" type="search" autocomplete="off" spellcheck="false" placeholder="Search worlds, authors, tags (日本語 OK)   e.g. lake -hangout" aria-label="Search">
      <button id="syntax-btn" data-testid="syntax-help" class="help" type="button" aria-expanded="false" aria-controls="syntax-pop" title="Search syntax">?</button>
      <div id="syntax-pop" class="pop" hidden></div>
    </div>
    <div id="sem-host" class="sem"></div>
    <button id="fbtn" class="fbtn" type="button">Filters</button>
    <span id="status" class="status" aria-live="polite"></span>
    <a class="aboutlink" href="./about.html">About · data · takedown</a>
  </header>
  <div id="sem-panel" class="sem-panel" hidden></div>
  <div class="layout">
    <aside id="facets" class="facets"></aside>
    <main>
      <div id="pills" class="pills" data-testid="pills" hidden></div>
      <div class="toolbar">
        <div id="summary" class="summary"></div>
        <div id="sorts" class="sorts" data-testid="facet-sort" role="group" aria-label="Sort by"></div>
      </div>
      <section id="semantic" data-testid="semantic-results" hidden><h3>Related by meaning <small id="sem-ms"></small></h3><p id="sem-hint" class="dim" hidden>Type a search to see worlds related by meaning.</p><ol id="sem-list" class="results strip"></ol></section>
      <ol id="results" data-testid="results" class="results"></ol>
      <button id="more" class="more" hidden>Show more</button>
    </main>
    <aside id="detail" class="detail" data-testid="detail-panel" hidden></aside>
  </div>
</div>
<script type="module" src="./src/main.ts"></script>
</body>
</html>
