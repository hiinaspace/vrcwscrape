<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VRChat World Search</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%236d5dfc'/%3E%3C/svg%3E">
</head>
<body>
<div id="app">
  <header class="top">
    <h1>VRChat World Search</h1>
    <input id="q" data-testid="search-input" type="search" autocomplete="off" spellcheck="false" placeholder="Search worlds, authors, tags (日本語 OK)" aria-label="Search">
    <label class="adult"><input type="checkbox" id="adult-toggle" data-testid="adult-toggle"> Show adult worlds</label>
    <label class="sem"><input type="checkbox" id="sem-toggle" data-testid="semantic-toggle"> semantic search (downloads ~33 MB) <span id="sem-note"></span></label>
    <button id="fbtn" class="fbtn" type="button">Filters</button>
    <span id="status" class="status" aria-live="polite"></span>
  </header>
  <div class="layout">
    <aside id="facets" class="facets"></aside>
    <main>
      <div id="summary" class="summary"></div>
      <section id="semantic" data-testid="semantic-results" hidden><h3>Related by meaning <small id="sem-ms"></small></h3><ol id="sem-list" class="results"></ol></section>
      <ol id="results" data-testid="results" class="results"></ol>
      <button id="more" class="more" hidden>Show more</button>
    </main>
  </div>
  <div id="card-root"></div>
</div>
<script type="module" src="./src/main.ts"></script>
</body>
</html>
